<body>
<h1>NKUMBA UNIVERSITY APPLICATION FORM</h1>
<form>
<!--textbox control-->
<p>FIRST NAME:</p>
<input type="text" name="FIRST NAME" maxlength="10"/><br>
<p>LAST NAME:</p>
<input type="text" name="LAST NAME" maxlength="10"/><br
<p>OTHER NAME:</p>
<input type="text" name="OTHER NAME" maxlenth="10"/><br>

<p>EMAIL:</p>
<input type="email" name="email" maxlength="15" placeholder="example@gmail.com"/><br/>

<p>NATIONALITY</p>
<select name="NATIONALITY">

<!--radio button control-->

<input type="radio"name="campus"/>ENTEBBE
<input type="radio"name="campus"/>KAMPALA
<br/>

<p>SELECT SCHOOL:

<option>SCHOOL OF COMPUTING AND INFORMATICS</option>
<option>SCHOOL OF BUSSINESS MANAGEMENT</option>

<input type="reset" value="DELETE FORM"/>
